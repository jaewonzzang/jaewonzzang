<svg xmlns="http://www.w3.org/2000/svg" width="400" height="180" viewBox="0 0 400 180" role="img" aria-label="findU — 통학 시간 기준 대학 랭킹 서비스">
  <defs>
    <clipPath id="fuCard"><rect width="400" height="180" rx="16"/></clipPath>
    <linearGradient id="fuWash" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#4F7CFF" stop-opacity="0.26"/>
      <stop offset="60%" stop-color="#4F7CFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#4F7CFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="fuDots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="0.8" fill="#EDE7DA" opacity="0.05"/>
    </pattern>
  </defs>

  <g clip-path="url(#fuCard)">
    <rect width="400" height="180" fill="#211D28"/>
    <rect width="400" height="180" fill="url(#fuWash)"/>

    <!-- isochrone motif -->
    <g>
      <circle cx="338" cy="74" r="26" fill="none" stroke="#4F7CFF" stroke-width="1" opacity="0.50"/>
      <circle cx="338" cy="74" r="46" fill="none" stroke="#4F7CFF" stroke-width="1" opacity="0.32"/>
      <circle cx="338" cy="74" r="66" fill="none" stroke="#4F7CFF" stroke-width="1" opacity="0.20"/>
      <circle cx="338" cy="74" r="86" fill="none" stroke="#4F7CFF" stroke-width="1" opacity="0.11"/>
      <g stroke="#4F7CFF" stroke-width="1" opacity="0.40" stroke-dasharray="2 3">
        <path d="M338 74 L312 48"/>
        <path d="M338 74 L372 60"/>
        <path d="M338 74 L378 108"/>
        <path d="M338 74 L306 116"/>
      </g>
      <g fill="#EDE7DA" opacity="0.78">
        <circle cx="312" cy="48" r="3"/>
        <circle cx="372" cy="60" r="3"/>
        <circle cx="378" cy="108" r="3"/>
        <circle cx="306" cy="116" r="3"/>
      </g>
      <circle cx="338" cy="74" r="4.5" fill="#4F7CFF"/>
      <circle cx="338" cy="74" r="9" fill="none" stroke="#4F7CFF" stroke-width="1.5" opacity="0.7"/>
    </g>

    <rect width="400" height="180" fill="url(#fuDots)"/>
    <rect x="0" y="26" width="4" height="128" fill="#4F7CFF"/>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif">
      <text x="26" y="38" fill="#8B8496" font-size="9.5" font-weight="700" letter-spacing="3.2">01 &#183; PROJECT</text>
      <text x="26" y="72" fill="#EDE7DA" font-size="25" font-weight="800" letter-spacing="-0.2">findU</text>
      <text x="26" y="96" fill="#C9C2D4" font-size="12.5">통학 시간 기준 대학 랭킹 서비스</text>
      <text x="26" y="115" fill="#8B8496" font-size="10.5">카카오맵 경로 API 기반 랭킹 산출</text>

      <g font-size="10.5" font-weight="600">
        <rect x="26" y="136" width="65" height="22" rx="11" fill="none" stroke="#4F7CFF" stroke-opacity="0.55"/>
        <text x="58.5" y="151" fill="#7E9CFF" text-anchor="middle">FastAPI</text>
        <rect x="99" y="136" width="53" height="22" rx="11" fill="none" stroke="#4F7CFF" stroke-opacity="0.55"/>
        <text x="125.5" y="151" fill="#7E9CFF" text-anchor="middle">React</text>
        <rect x="160" y="136" width="41" height="22" rx="11" fill="none" stroke="#4F7CFF" stroke-opacity="0.55"/>
        <text x="180.5" y="151" fill="#7E9CFF" text-anchor="middle">AWS</text>
      </g>
    </g>

    <rect x="0.5" y="0.5" width="399" height="179" rx="16" fill="none" stroke="#3A3345"/>
  </g>
</svg>
