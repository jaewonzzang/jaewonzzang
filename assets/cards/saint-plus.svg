<svg xmlns="http://www.w3.org/2000/svg" width="400" height="180" viewBox="0 0 400 180" role="img" aria-label="Saint+ — RAG 기반 수강 설계 도우미">
  <defs>
    <clipPath id="spCard"><rect width="400" height="180" rx="16"/></clipPath>
    <linearGradient id="spWash" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#FF5C8A" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#FF5C8A" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FF5C8A" stop-opacity="0"/>
    </linearGradient>
    <pattern id="spDots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="0.8" fill="#EDE7DA" opacity="0.05"/>
    </pattern>
  </defs>

  <g clip-path="url(#spCard)">
    <rect width="400" height="180" fill="#211D28"/>
    <rect width="400" height="180" fill="url(#spWash)"/>

    <!-- embedding space motif -->
    <g>
      <g stroke="#FF5C8A" stroke-width="1" opacity="0.28">
        <path d="M296 44 L322 32 L340 52 L296 44"/>
        <path d="M372 42 L386 66 L358 72 L372 42"/>
        <path d="M290 104 L314 118 L296 134 L290 104"/>
        <path d="M364 116 L384 132"/>
      </g>
      <g stroke="#FF5C8A" stroke-width="1" opacity="0.55" stroke-dasharray="2 3">
        <path d="M336 84 L322 32"/>
        <path d="M336 84 L372 42"/>
        <path d="M336 84 L314 118"/>
        <path d="M336 84 L364 116"/>
      </g>
      <g fill="#EDE7DA" opacity="0.68">
        <circle cx="296" cy="44" r="2.6"/>
        <circle cx="322" cy="32" r="2.6"/>
        <circle cx="340" cy="52" r="2.6"/>
        <circle cx="372" cy="42" r="2.6"/>
        <circle cx="386" cy="66" r="2.6"/>
        <circle cx="358" cy="72" r="2.6"/>
        <circle cx="290" cy="104" r="2.6"/>
        <circle cx="314" cy="118" r="2.6"/>
        <circle cx="296" cy="134" r="2.6"/>
        <circle cx="364" cy="116" r="2.6"/>
        <circle cx="384" cy="132" r="2.6"/>
      </g>
      <circle cx="336" cy="84" r="5" fill="#FF5C8A"/>
      <circle cx="336" cy="84" r="11" fill="none" stroke="#FF5C8A" stroke-width="1.5" opacity="0.65"/>
      <circle cx="336" cy="84" r="20" fill="none" stroke="#FF5C8A" stroke-width="1" opacity="0.28"/>
    </g>

    <rect width="400" height="180" fill="url(#spDots)"/>
    <rect x="0" y="26" width="4" height="128" fill="#FF5C8A"/>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif">
      <text x="26" y="38" fill="#8B8496" font-size="9.5" font-weight="700" letter-spacing="3.2">03 &#183; PROJECT</text>
      <text x="26" y="72" fill="#EDE7DA" font-size="25" font-weight="800" letter-spacing="-0.2">Saint+</text>
      <text x="26" y="96" fill="#C9C2D4" font-size="12.5">RAG 기반 수강 설계 도우미</text>
      <text x="26" y="115" fill="#FF8FAE" font-size="10.5" font-weight="600">교내 AI 공모전 · 196팀 중 상위 5%</text>

      <g font-size="10.5" font-weight="600">
        <rect x="26" y="136" width="41" height="22" rx="11" fill="none" stroke="#FF5C8A" stroke-opacity="0.55"/>
        <text x="46.5" y="151" fill="#FF8FAE" text-anchor="middle">RAG</text>
        <rect x="75" y="136" width="53" height="22" rx="11" fill="none" stroke="#FF5C8A" stroke-opacity="0.55"/>
        <text x="101.5" y="151" fill="#FF8FAE" text-anchor="middle">SBERT</text>
        <rect x="136" y="136" width="59" height="22" rx="11" fill="none" stroke="#FF5C8A" stroke-opacity="0.55"/>
        <text x="165.5" y="151" fill="#FF8FAE" text-anchor="middle">Docker</text>
      </g>
    </g>

    <rect x="0.5" y="0.5" width="399" height="179" rx="16" fill="none" stroke="#3A3345"/>
